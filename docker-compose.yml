version: '3.8'

services:
  project-service:
    build:
      context: .
      dockerfile: project-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081

  tendering-service:
    build:
      context: .
      dockerfile: tendering-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082

  operations-service:
    build:
      context: .
      dockerfile: operations-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083

  hr-news-service:
    build:
      context: .
      dockerfile: hr-news-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - PROJECT_SERVICE_URL=http://project-service:8081
      - TENDERING_SERVICE_URL=http://tendering-service:8082
      - OPERATIONS_SERVICE_URL=http://operations-service:8083
      - HR_NEWS_SERVICE_URL=http://hr-news-service:8084
    depends_on:
      - project-service
      - tendering-service
      - operations-service
      - hr-news-service
