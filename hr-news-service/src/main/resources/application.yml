server:
  port: 8084

spring:
  application:
    name: hr-news-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/GasPipeline}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:9906}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
