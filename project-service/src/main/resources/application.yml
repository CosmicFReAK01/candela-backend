server:
  port: ${PORT:8081}

spring:
  application:
    name: project-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres.hsqgnqvplceflkfajnzn}
    password: ${DB_PASSWORD:CosmicFReAK@123}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-timeout: 20000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 30
        jdbc:
          batch_size: 30
  cache:
    type: caffeine
    cache-names:
      - projects
      - project_by_slug
      - services
      - service_by_slug
      - fleet
      - states
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

management:
  endpoints:
    web:
      exposure:
        include: health,info
