server:
  port: ${PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: api-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres.hsqgnqvplceflkfajnzn}
    password: ${DB_PASSWORD:CosmicFReAK@123}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-timeout: 20000
      keepalive-time: 30000
      validation-timeout: 3000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 30
        jdbc:
          batch_size: 30
  cache:
    type: caffeine
    cache-names:
      - projects
      - project_by_slug
      - services
      - service_by_slug
      - fleet
      - states
      - news
      - news_by_id
      - careers
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

services:
  project-service:
    url: ${PROJECT_SERVICE_URL:http://localhost:8081}
  tendering-service:
    url: ${TENDERING_SERVICE_URL:http://localhost:8082}
  operations-service:
    url: ${OPERATIONS_SERVICE_URL:http://localhost:8083}
  hr-news-service:
    url: ${HR_NEWS_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
