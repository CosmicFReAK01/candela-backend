server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/GasPipeline}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:9906}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

services:
  project-service:
    url: ${PROJECT_SERVICE_URL:http://localhost:8081}
  tendering-service:
    url: ${TENDERING_SERVICE_URL:http://localhost:8082}
  operations-service:
    url: ${OPERATIONS_SERVICE_URL:http://localhost:8083}
  hr-news-service:
    url: ${HR_NEWS_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
